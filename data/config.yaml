# Source of truth for the Configuration page. Hugo renders this into BOTH the
# static reference table (works with JS off) and the data fed to the config
# builder (assets/js/config-builder.js). Edit a variable once, here.
#
# Per variable:
#   name      env var name
#   default   shown default ("—" style strings allowed; see `generated`)
#   type      text | path | int | duration | bool | enum | secret
#   purpose   one-line description (Markdown-light: `code` spans ok in the static table)
#   options   (enum only) allowed values, first is the default
#   example   (optional) placeholder shown in the builder's input
#   generated (secret only) true => offer in-browser generation, "GEN" badge
#
# Reuse: set `meta` (image + service/container name) and edit `groups`. Another
# page can render a second builder with {{< config-builder data="other" >}},
# which reads data/other.yaml. The output formats (Compose / docker run / .env)
# are Docker-oriented; for other targets, adjust generate() in config-builder.js.

meta:
  image: ghcr.io/listenupapp/listenup-server:latest
  service: listenup          # compose service name and `docker run --name`

groups:
  - id: core
    title: Core & runtime
    icon: sliders
    vars:
      - name: LISTENUP_HOME
        default: "~/ListenUp"
        type: path
        example: /data
        purpose: "Data directory: the SQLite database, secrets.properties, cover art, and the scan spool. Use an absolute path; ~ is read literally, not shell-expanded."
      - name: PORT
        default: "8080"
        type: int
        example: "8080"
        purpose: "HTTP listen port. Note the variable is PORT, not LISTENUP_PORT."
      - name: LISTENUP_SERVER_NAME
        default: ListenUp
        type: text
        example: My Library
        purpose: "Instance display name, shown on the public invite landing page."
      - name: LISTENUP_DATA_DIR_LOCK
        default: "true"
        type: bool
        purpose: "Takes an exclusive OS lock on the data directory so two server processes can't share one home and race the scan spool."
      - name: LISTENUP_DB_URL
        default: "(empty)"
        type: text
        example: "jdbc:sqlite:/fast-disk/listenup.db"
        purpose: "Moves only the database. Leave unset and it lives at listenup.db inside LISTENUP_HOME."
      - name: LISTENUP_TRUST_PROXY
        default: "false"
        type: bool
        purpose: "Trust the X-Forwarded-For header, so sign-in rate limits count each real visitor instead of the proxy. Turn on only behind a reverse proxy you control, with the server not reachable directly."
      - name: LISTENUP_WEB_ROOT
        default: "/app/web"
        type: path
        purpose: "Where the web client is served from. The image sets it; set it to an empty value to serve no web client at all."

  - id: secrets
    title: Secrets
    icon: shield
    note: "Leave these unset and ListenUp generates secure values on first boot, persisting them to secrets.properties. Back up that file."
    vars:
      - name: LISTENUP_JWT_SECRET
        default: generated
        type: secret
        generated: true
        purpose: "HS256 signing secret, at least 32 bytes. An explicit value that's the committed default, or shorter than 32 bytes, fails startup."
      - name: LISTENUP_REFRESH_PEPPER
        default: generated
        type: secret
        generated: true
        purpose: "HMAC-SHA-256 pepper for refresh tokens, at least 32 bytes. Rotating it invalidates all stored hashes, forcing every user to re-authenticate."

  - id: registration
    title: Registration
    icon: people
    vars:
      - name: LISTENUP_REGISTRATION_POLICY
        default: APPROVAL_QUEUE
        type: enum
        options: [APPROVAL_QUEUE, OPEN, CLOSED]
        purpose: "How new sign-ups are handled."

  - id: push
    title: Push notifications
    icon: phone
    note: "Push is on by default and routes through the ListenUp relay, which stores and logs nothing about the notifications it forwards. Payloads carry only opaque IDs that resolve to real content on-device. Turning push off is an admin setting in the app, not a variable."
    vars:
      - name: LISTENUP_PUSH_RELAY_URL
        default: "https://push.listenup.audio"
        type: text
        example: "https://push.example.com"
        purpose: "Which relay delivers notifications to FCM and APNs. Point this at your own relay to keep delivery entirely in-house."
      - name: LISTENUP_PUSH_SENDER_TOKEN
        default: "(empty)"
        type: text
        purpose: "Shared secret presented to the relay. Never logged. Leave unset unless you run your own relay and it expects one."

  - id: scanner
    title: Scanner & library
    icon: folder
    vars:
      - name: LISTENUP_LIBRARY_PATH
        default: "(empty)"
        type: path
        example: /audiobooks
        purpose: "Absolute folders used to seed the singleton library on first boot. Delimited by the OS path separator (: on Unix, ; on Windows)."
      - name: LISTENUP_METADATA_PRECEDENCE
        default: "(default order)"
        type: text
        example: "metadata.json, embedded, sidecar, filename, folder"
        purpose: "Comma-separated, highest priority first. An invalid token fails startup."
      - name: LISTENUP_EMBEDDED_COVER_CACHE_SIZE
        default: "1000"
        type: int
        example: "1000"
        purpose: "Maximum embedded-artwork covers held in the in-memory LRU cache."
      - name: LISTENUP_SCAN_RESCAN_ON_STARTUP
        default: "true"
        type: bool
        purpose: "Re-walk every library once on startup."
      - name: LISTENUP_SCAN_PERIODIC_RESCAN_INTERVAL
        default: "6h"
        type: duration
        example: "6h"
        purpose: "Periodic full-rescan backstop, as a Kotlin Duration (e.g. 30m). 0 or blank disables it; the live file watcher keeps running."

  - id: transcoding
    title: Transcoding
    icon: refresh
    note: "The server transcodes only when a client says it can't decode a book's audio, which in practice means browsers. FFmpeg ships inside the image, so there is nothing to install."
    vars:
      - name: LISTENUP_TRANSCODE_CACHE_BYTES
        default: "10737418240"
        type: int
        example: "10737418240"
        purpose: "Disk budget for transcoded audio under LISTENUP_HOME/transcode, in bytes (10 GiB by default). The oldest files are cleared first. 0 turns transcoding off."
      - name: LISTENUP_TRANSCODE_MAX_SESSIONS
        default: "2"
        type: int
        example: "2"
        purpose: "How many books may transcode at once. A listener over the limit is asked to retry rather than queued."
      - name: LISTENUP_TRANSCODE_BITRATE_KBPS
        default: "64"
        type: int
        example: "64"
        purpose: "Bitrate of the transcoded AAC stream, in kbps."
      - name: LISTENUP_TRANSCODE_PROBE_ON_STARTUP
        default: "true"
        type: bool
        purpose: "Checks at startup that FFmpeg can encode. If it can't, books are served untranscoded."
      - name: LISTENUP_FFMPEG
        default: "(bundled)"
        type: path
        example: /usr/local/bin/ffmpeg
        purpose: "Path to a different FFmpeg binary. Only useful outside the official image."

  - id: integrations
    title: Integrations
    icon: target
    vars:
      - name: LISTENUP_HARDCOVER_CLIENT_ID
        default: "(ListenUp's registered app)"
        type: text
        purpose: "The app identity members use to connect a Hardcover account. Set it to an empty value to turn Hardcover off for the whole server."

  - id: recovery
    title: Recovery
    icon: shield
    note: "Not a setting to leave on. See Accounts & recovery for the full procedure."
    vars:
      - name: LISTENUP_ROOT_RESET
        default: "(unset)"
        type: bool
        purpose: "Set to true for one start to print a one-time owner password reset code to the console. Remove it as soon as you've used it."

  - id: logging
    title: Logging
    icon: waveform
    note: "The server also writes its log to logs/server.log inside LISTENUP_HOME, rotating at 10 MB and keeping four older files."
    vars:
      - name: LISTENUP_LOG_LEVEL
        default: INFO
        type: enum
        options: [INFO, ERROR, WARN, DEBUG, TRACE]
        purpose: "Default log level."

  - id: dev
    title: Seed & development
    icon: rocket
    vars:
      - name: LISTENUP_SEED_PROFILE
        default: "(empty)"
        type: text
        example: demo
        purpose: "Selects a startup seed profile (demo data). Intended for development; only sort of works right now."
